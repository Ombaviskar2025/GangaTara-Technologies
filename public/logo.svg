<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 85" width="300" height="85" role="img" aria-label="GangaTara Technologies">
  <title>GangaTara Technologies</title>

  <!-- ─── Teal Swoosh / Wave Shape ─────────────────────────── -->
  <!-- Main body: sweeps from bottom-left up to the right -->
  <path d="M 8,70 C -1,44 7,10 40,18 C 26,31 22,52 33,65 Z" fill="#00BCD4"/>
  <!-- Wing / tail: curls to the right -->
  <path d="M 33,65 C 41,48 58,39 67,48 C 57,58 41,68 33,65 Z" fill="#00ACC1"/>

  <!-- ─── Three Gold Stars (above TARA, slight arc) ────────── -->
  <!-- star polygon R=7.5, r=3.2 centred at origin -->
  <!-- points: 0,-7.5  1.93,-2.65  7.13,-2.32  3.12,1.01  4.41,6.06  0,3.27  -4.41,6.06  -3.12,1.01  -7.13,-2.32  -1.93,-2.65 -->
  <g fill="#FFC107">
    <!-- Left star -->
    <polygon transform="translate(192,24)"
      points="0,-7.5 1.93,-2.65 7.13,-2.32 3.12,1.01 4.41,6.06 0,3.27 -4.41,6.06 -3.12,1.01 -7.13,-2.32 -1.93,-2.65"/>
    <!-- Centre-top star (slightly raised) -->
    <polygon transform="translate(209,16)"
      points="0,-7.5 1.93,-2.65 7.13,-2.32 3.12,1.01 4.41,6.06 0,3.27 -4.41,6.06 -3.12,1.01 -7.13,-2.32 -1.93,-2.65"/>
    <!-- Right star -->
    <polygon transform="translate(226,24)"
      points="0,-7.5 1.93,-2.65 7.13,-2.32 3.12,1.01 4.41,6.06 0,3.27 -4.41,6.06 -3.12,1.01 -7.13,-2.32 -1.93,-2.65"/>
  </g>

  <!-- ─── "GANGA" in Red ───────────────────────────────────── -->
  <text
    x="76" y="63"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="33"
    fill="#D32F2F">GANGA</text>

  <!-- ─── "TARA" in Green ──────────────────────────────────── -->
  <text
    x="198" y="63"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="33"
    fill="#2E7D32">TARA</text>

  <!-- ─── "TECHNOLOGIES" in Navy Blue ─────────────────────── -->
  <text
    x="76" y="79"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="10.5"
    fill="#1565C0"
    letter-spacing="3.2">TECHNOLOGIES</text>
</svg>
